<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>Simple Solitaire</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#E6EAE9;--panel:#F1F4F3;--ink:#1B2226;--mut:#6A767B;--line:#C3CCCB;--face:#FCFCFB;--cl:#D3DAD9;--red:#C4444F;--blk:#1B2226;--b1:#3E607F;--b2:#2F4C68;--acc:#3F7D6C;--blue:#3D74C2;--yellow:#E2C24A;--grn:#3C8B58;--sh:0 1px 2px rgba(20,30,35,.18),0 6px 14px -6px rgba(20,30,35,.28)}
[data-theme=dark]{--bg:#0E1315;--panel:#182024;--ink:#E4E9EA;--mut:#8B989D;--line:#2A373D;--face:#1C252A;--cl:#2E3B41;--red:#FF7C88;--blk:#E4E9EA;--b1:#37587A;--b2:#26405A;--acc:#6FC2A9;--blue:#78B0FF;--yellow:#F4D55A;--grn:#74D19A;--sh:0 1px 2px rgba(0,0,0,.5),0 8px 16px -6px rgba(0,0,0,.65)}
[data-theme=midnight]{--bg:#000;--panel:#0E0F11;--ink:#E8E8EA;--mut:#7E7E86;--line:#232529;--face:#0F1113;--cl:#292C31;--red:#FF6F7C;--blk:#E8E8EA;--b1:#2B4368;--b2:#141F33;--acc:#7CD6BD;--blue:#78B0FF;--yellow:#F4D55A;--grn:#74D19A;--sh:0 1px 2px rgba(0,0,0,.7),0 8px 16px -6px rgba(0,0,0,.9)}
[data-theme=vintage]{--bg:#D6C69B;--panel:#E4D6AF;--ink:#3A2A1C;--mut:#7B6647;--line:#B7A276;--face:#F4E9CC;--cl:#CDB98A;--red:#A5372F;--blk:#3A2A1C;--b1:#7C3131;--b2:#4F1C1C;--acc:#8B5E2B;--blue:#2F5F8F;--yellow:#D9B63E;--grn:#3E6B3A;--sh:0 1px 2px rgba(60,40,10,.3),0 6px 14px -6px rgba(60,40,10,.4)}
[data-theme=felt]{--bg:#1D5A42;--panel:#174A37;--ink:#EFF5F0;--mut:#A6C7B7;--line:#3E7E63;--face:#FBFBF7;--cl:#CBD6CF;--red:#C23B3B;--blk:#1B2226;--b1:#234E7D;--b2:#153455;--acc:#F2D27A;--yellow:#E5C654;--sh:0 1px 2px rgba(0,0,0,.35),0 8px 14px -6px rgba(0,0,0,.45)}
[data-theme=ocean]{--bg:#0B2233;--panel:#10304A;--ink:#E4F1F7;--mut:#86A9BC;--line:#1D4A69;--face:#F2F8FB;--cl:#C5D9E4;--red:#D0475A;--blk:#12232E;--b1:#2D7FA3;--b2:#1B5673;--acc:#6FD3E0;--yellow:#E6C84A;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 14px -6px rgba(0,0,0,.5)}
[data-theme=lavender]{--bg:#E9E6F5;--panel:#F4F2FB;--ink:#24203A;--mut:#6D6787;--line:#CBC5E4;--face:#FFF;--cl:#D9D4EE;--red:#C93F6B;--blk:#24203A;--b1:#6C58C8;--b2:#4B3B96;--acc:#6C58C8;--yellow:#DDBB3C;--sh:0 1px 2px rgba(40,30,90,.18),0 6px 14px -6px rgba(40,30,90,.3)}
[data-theme=crimson]{--bg:#2A0D11;--panel:#3E171C;--ink:#F7F0D7;--mut:#D6B76E;--line:#6A2E33;--face:#4C1F26;--cl:#7B3A40;--red:#E95D5D;--blk:#F7F0D7;--b1:#6F0E1B;--b2:#3A0A11;--acc:#F4D55A;--blue:#7BAAF5;--yellow:#F4D55A;--grn:#7EBC88;--sh:0 1px 2px rgba(20,0,0,.52),0 8px 16px -6px rgba(20,0,0,.7)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 "DM Sans",system-ui,sans-serif;transition:background .5s,color .5s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#bar{position:relative;flex:none;height:48px;display:flex;align-items:center;gap:10px;padding:0 12px}
h1{font:400 1.6rem/1 "Instrument Serif",serif;margin:0;letter-spacing:.01em}
h1 button{font:inherit;line-height:inherit;letter-spacing:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.st{position:absolute;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums}
.st span{white-space:nowrap}
.st span:first-child{text-align:right}
.st span:last-child{text-align:left}
.st .btn{padding:.32rem .65rem;font-size:.8rem;white-space:nowrap}
.ac{display:flex;gap:6px;margin-left:auto}
#area{flex:1;min-height:0;display:flex;justify-content:center;align-items:flex-start;padding:4px 6px 6px;overflow-x:hidden;overflow-y:auto}
#board{position:relative;flex:none}
.btn,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;cursor:pointer;transition:background .2s,border-color .2s,transform .15s}
select{appearance:none;-webkit-appearance:none;background:var(--panel)}
.btn:hover,select:hover{background:var(--panel);border-color:var(--mut)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.35;cursor:default}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.p:hover{opacity:.85;background:var(--ink)}
.ic{width:38px;height:38px;padding:0;display:grid;place-items:center}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border-radius:999px;padding:3px}
.seg::before{content:"";position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:var(--face);box-shadow:var(--sh);transition:transform .35s cubic-bezier(.3,.9,.3,1)}
.seg[data-d="3"]::before{transform:translateX(100%)}
.seg button{position:relative;border:0;background:none;color:var(--ink);font:inherit;padding:.32rem 1rem;cursor:pointer;border-radius:999px}
.slot,.card{position:absolute;left:0;top:0;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.09)}
.slot{border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--line);font:calc(var(--cw)*.36) "Instrument Serif",serif;transition:border-color .5s,color .5s}
.slot[data-k=stock]{cursor:pointer}
.card{font-size:var(--cw);transition:transform calc(.45s*var(--spd,1)) cubic-bezier(.2,.85,.25,1);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.in{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(180deg);transition:transform calc(.55s*var(--spd,1)) cubic-bezier(.3,.8,.3,1);transition-delay:inherit;border-radius:.09em}
.up .in{transform:rotateY(0)}
.f,.b{position:absolute;inset:0;border-radius:.09em;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--sh)}
.f{background:var(--face);color:var(--blk);border:1px solid var(--cl);transition:background .5s,color .5s}
.r .f{color:var(--red)}
.fc .card.s0 .f{color:var(--blk)}
.fc .card.s1 .f{color:var(--red)}
.fc .card.s2 .f{color:var(--yellow)}
.fc .card.s3 .f{color:var(--blue)}
.f b{position:absolute;left:.08em;top:.02em;font:400 .29em/1.1 "Instrument Serif",serif}
.f i{position:absolute;right:.08em;top:.06em;font:normal .22em/1 "DM Sans",sans-serif}
.f u{position:absolute;left:0;right:0;bottom:.13em;text-align:center;font:normal .6em/1 "DM Sans",sans-serif;text-decoration:none;opacity:.9}
.b{transform:rotateY(180deg);background:repeating-linear-gradient(45deg,rgba(255,255,255,.05) 0 .04em,transparent .04em .1em),linear-gradient(145deg,var(--b1),var(--b2))}
.b::after{content:"";position:absolute;inset:.07em;border:1px solid rgba(255,255,255,.28);border-radius:.05em}
.card.drag{transition:none!important;cursor:grabbing}
.card.drag .f{box-shadow:0 18px 30px -8px rgba(0,0,0,.4)}
.noanim .card,.noanim .in{transition:none!important}
#sheet{position:fixed;right:max(8px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 50px);z-index:800;width:min(340px,calc(100vw - 16px));max-height:calc(100dvh - env(safe-area-inset-top,0px) - 60px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:6px 16px;box-shadow:var(--sh);animation:rise .3s cubic-bezier(.2,.9,.3,1)}
#sheet[hidden],#lose[hidden],#win[hidden],#start[hidden],#s1[hidden],#s2[hidden],#fin[hidden],#resume[hidden]{display:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row.col{flex-direction:column;align-items:flex-start}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:36px;height:21px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .25s;margin:0;flex:none}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--face);box-shadow:var(--sh);transition:transform .25s cubic-bezier(.3,.9,.3,1)}
input[type=checkbox]:checked{background:var(--acc)}
input[type=checkbox]:checked::after{transform:translateX(15px)}
#themes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px 4px;width:100%}
.th{border:0;background:none;color:var(--ink);font:inherit;font-size:.72rem;display:grid;justify-items:center;gap:5px;cursor:pointer;padding:2px}
.th i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%);outline:1.5px solid var(--line);outline-offset:2px;transition:outline-color .2s,transform .2s}
.th:hover i{transform:scale(1.08)}
.th.on i{outline:2px solid var(--acc)}
#backs{display:flex;gap:8px}
.sw{width:22px;height:30px;border-radius:5px;border:0;cursor:pointer;padding:0;outline:1.5px solid var(--line);outline-offset:2px;background:linear-gradient(145deg,var(--b1),var(--b2))}
.sw.on{outline:2px solid var(--acc)}
#msg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;transform:translateX(-50%);z-index:1200;background:var(--ink);color:var(--bg);padding:.4rem 1rem;border-radius:99px;font-size:.85rem;max-width:calc(100vw - 24px);text-align:center;box-shadow:var(--sh);pointer-events:none}
#msg:empty{display:none}
#fin,#giveup{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:600;padding:.85rem 2.2rem;font-size:1.05rem;box-shadow:var(--sh);animation:pop .55s cubic-bezier(.2,1.4,.3,1)}
#fin:active,#giveup:active{transform:translateX(-50%) scale(.96)}
#start{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;overflow:auto;padding:20px;transition:opacity .5s}
#start.out{opacity:0;pointer-events:none}
#s1,#s2{margin:auto;text-align:center;display:grid;gap:16px;justify-items:center;animation:rise .6s cubic-bezier(.2,.9,.3,1);width:100%}
#start h2{font:italic 400 clamp(3rem,15vw,6.5rem)/1 "Instrument Serif",serif;margin:0}
#start h3{font:400 2rem/1 "Instrument Serif",serif;margin:0}
#start p{margin:0;color:var(--mut);letter-spacing:.12em;text-transform:lowercase}
.suits{display:flex;gap:18px;font-size:2rem}
.suits i{font-style:normal;animation:bob 3s ease-in-out infinite}
.suits i:nth-child(2){animation-delay:.3s;color:var(--red)}
.suits i:nth-child(3){animation-delay:.6s;color:var(--red)}
.suits i:nth-child(4){animation-delay:.9s}
.play{font-size:1.2rem;padding:.9rem 3.4rem}
.lvs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:min(640px,100%)}
.lv[data-lv=any]{grid-column:3}
.lv{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit;cursor:pointer;transition:transform .2s,border-color .2s}
.lv:hover{border-color:var(--acc);transform:translateY(-2px)}
.lv.on{border-color:var(--acc)}
.lv b{display:block;font:400 1.4rem/1.2 "Instrument Serif",serif}
.lv span{color:var(--mut);font-size:.8rem}
#start.busy .lvs,#start.busy .seg{opacity:.4;pointer-events:none}
#win,#lose{position:fixed;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000}
#win>div,#lose>div{text-align:center;animation:rise .7s cubic-bezier(.2,.9,.3,1)}
#win h2,#lose h2{font:italic 400 clamp(3.5rem,14vw,7rem)/1 "Instrument Serif",serif;margin:0 0 6px}
#win p,#lose p{color:var(--mut);margin:0 0 22px}
#lose .bs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#lose h2{opacity:.92}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.97)}}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(34px) scale(.8)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@media(max-width:480px){h1{font-size:1.3rem}.st{gap:4px;font-size:.7rem;min-width:0}.st .btn{padding:.24rem .35rem;font-size:.68rem}#undo{padding:.24rem .4rem;font-size:.7rem}#bar{gap:6px;padding:0 8px}.lvs{grid-template-columns:repeat(2,minmax(0,1fr))}.lv[data-lv=any]{grid-column:1 / -1;justify-self:center;width:calc(50% - 5px)}}
@media(max-width:480px){h1{font-size:1rem}}
@media(max-width:340px){.brand-full{display:none}.brand-short{display:inline}.st{gap:2px;font-size:.62rem}.st .btn{padding:.18rem .25rem;font-size:.62rem}#undo{padding:.18rem .25rem;font-size:.62rem}}
@media(max-height:480px){#bar{height:42px}#start h2{font-size:2.8rem}#start h3{font-size:1.5rem}.suits{display:none}#s1,#s2{gap:10px}.lvs{grid-template-columns:repeat(3,1fr)}.lv{padding:8px 10px}.lv b{font-size:1.15rem}.lv span{font-size:.7rem}#sheet{top:calc(env(safe-area-inset-top,0px) + 44px)}}
@media(prefers-reduced-motion:reduce){.card,.in,.seg::before{transition-duration:.01s!important}#win>div,#lose>div{animation:none}}
.card.hint .f,.card.hint .b{box-shadow:0 0 0 3px var(--acc),var(--sh)}
.slot.hint{border:2px solid var(--acc);color:var(--acc)}
#sts{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#sts[hidden]{display:none}
#sts>div{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;width:min(440px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow:auto;box-shadow:var(--sh);animation:rise .3s}
#sts h3{font:400 1.8rem/1 "Instrument Serif",serif;margin:0 0 12px}
#sts .g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;text-align:center}
#sts .g b{display:block;font:400 1.6rem/1.1 "Instrument Serif",serif}
#sts .g span{color:var(--mut);font-size:.75rem}
#sts table{width:100%;border-collapse:collapse;font-size:.82rem;margin-bottom:14px;font-variant-numeric:tabular-nums}
#sts th{color:var(--mut);font-weight:400;text-align:right;padding:4px 0}
#sts td{padding:5px 0;text-align:right;border-top:1px solid var(--line)}
#sts th:first-child,#sts td:first-child{text-align:left}
@media(max-width:480px){#hint{display:none}}
</style>
</head>
<body>
<div id="app">
<header id="bar">
<h1><button id="home" type="button" aria-label="Return to game"><span class="brand-full">Simple Solitaire</span><span class="brand-short" hidden>Solitaire</span></button></h1>
<div class="st"><span id="mv">0 moves</span><button class="btn" id="new-top" type="button">New game</button><span id="tm">0:00</span></div>
<div class="ac"><button class="btn" id="hint">Hint</button><button class="btn" id="undo">Undo</button><button class="btn ic" id="menu" aria-expanded="false" aria-label="Menu"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/></svg></button></div>
</header>
<div id="area"><main id="board"></main></div>
</div>
<div id="sheet" hidden>
<div class="row"><button class="btn p" id="new">New game</button><button class="btn" id="chk">Still winnable?</button></div>
<div class="row"><button class="btn" id="hint-m">Hint</button><button class="btn" id="st-btn">Stats</button><button class="btn" id="rs">Restart deal</button></div>
<div class="row col"><span>Theme</span><div id="themes"></div></div>
<label class="row"><span>Auto-collect safe cards</span><input type="checkbox" id="o-auto"></label>
<label class="row"><span>Four-colour suits</span><input type="checkbox" id="o-fc"></label>
<label class="row"><span>Show timer</span><input type="checkbox" id="o-tm"></label>
<div class="row"><span>Send to foundation</span><select id="o-mv" aria-label="Send to foundation"><option value="2">Double click</option><option value="1">Single click</option></select></div>
<div class="row"><span>Animation</span><select id="o-sp" aria-label="Animation speed"><option value="0">Off</option><option value="0.5">Fast</option><option value="1">Normal</option><option value="1.8">Slow</option></select></div>
<div class="row"><span>Win animation</span><select id="o-wa" aria-label="Win animation"><option value="random">Random</option><option value="scatter">Scatter</option><option value="bounce">Bounce</option><option value="fan">Fan</option><option value="spiral">Spiral</option></select></div>
<div class="row"><span>Card size</span><select id="o-sz" aria-label="Card size"><option value="720">Small</option><option value="880">Medium</option><option value="1100">Large</option></select></div>
<div class="row col"><span>Card back</span><div id="backs"></div></div>
</div>
<div id="msg" role="status"></div>
<button class="btn p" id="fin" hidden>Finish game</button>
<button class="btn p" id="giveup" hidden>Give up</button>
<div id="start">
<div id="s1"><div class="suits"><i>&#9824;&#65038;</i><i>&#9829;&#65038;</i><i>&#9830;&#65038;</i><i>&#9827;&#65038;</i></div><h2>Simple Solitaire</h2><p>by josuevbroque</p><button class="btn p play" id="play">Play</button></div>
<div id="s2" hidden><h3>New game</h3>
<div class="seg" data-d="3" role="group" aria-label="Cards per draw"><button data-d="1">Draw 1</button><button data-d="3">Draw 3</button></div>
<div class="lvs">
<button class="lv" data-lv="trivial"><b>Trivial</b><span>Basically plays itself</span></button>
<button class="lv" data-lv="easy"><b>Easy</b><span>Nice for casual play</span></button>
<button class="lv" data-lv="medium"><b>Medium</b><span>Thinking required</span></button>
<button class="lv" data-lv="hard"><b>Hard</b><span>It's gonna be hard</span></button>
<button class="lv" data-lv="impossible"><b>Impossible</b><span>I bet you can't win</span></button>
</div>
<button class="btn p" id="daily">Daily challenge</button><button class="btn" id="resume" hidden>Back to game</button></div>
</div>
<div id="sts" hidden><div></div></div>
<div id="lose" hidden><div><h2>Stuck</h2><p id="lp"></p><div class="bs"><button class="btn" id="l-undo">Undo</button><button class="btn" id="l-rs">Restart deal</button><button class="btn p" id="l-new">New game</button></div></div></div>
<div id="win" hidden><div><h2>Solved</h2><p id="wp"></p><button class="btn p" id="again">Play again</button></div></div>
<script id="solver" type="text/plain">
const su=c=>c/13|0,rk=c=>c%13+1,rd=c=>{const s=c/13|0;return s==1||s==2};
const cut=(col,n)=>{const a=col.a.slice(0,col.a.length-n);let u=col.u-n;if(u==0&&a.length)u=1;return{a,u}};
function shuf(a){a=a||[...Array(52).keys()];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function dealFrom(d){const k=d.slice(),t=[];for(let i=0;i<7;i++)t.push({a:[],u:1});for(let r=0;r<7;r++)for(let c=r;c<7;c++)t[c].a.push(k.pop());return{t,f:[0,0,0,0],k,w:[]}}
function deadDeal(){for(;;){
 const pool=shuf().filter(c=>rk(c)>1),tops=[];
 for(const c of pool){if(tops.length==7)break;if(tops.every(t=>!(rd(t)!=rd(c)&&(rk(t)==rk(c)+1||rk(c)==rk(t)+1))))tops.push(c)}
 if(tops.length<7)continue;
 const bur=new Set([0,13,26,39]);
 tops.forEach(t=>{for(let c=0;c<52;c++)if(rk(c)==rk(t)-1&&rd(c)!=rd(t))bur.add(c)});
 if(bur.size>21)continue;
 const rest=shuf().filter(c=>!tops.includes(c)&&!bur.has(c)),down=[...bur];
 while(down.length<21)down.push(rest.pop());
 shuf(down);let di=0;const pos=[];
 for(let r=0;r<7;r++)for(let c=r;c<7;c++)pos.push(r==c?tops[c]:down[di++]);
 return rest.concat(pos.reverse())}}
function moves(s,dr){

  if(L){const c=col.a[L-1];if(s.f[su(c)]==rk(c)-1){const n=mk();n.f[su(c)]++;n.t[i]=cut(col,1);F.push(n)}}

function solve(s,dr,cap,prog,nr){let n=0;const seen=Array.from({length:16},()=>new Set()),st=[];

 let to=-1;for(let e=0;e<7;e++)if(n.t[e].a.length>s.t[e].a.length)to=e;

const RNG={1:{trivial:[.95,1.1],easy:[.7,.95],medium:[.35,.7],hard:[.02,.35]},3:{trivial:[.6,1.1],easy:[.35,.6],medium:[.15,.35],hard:[.02,.15]}};

  for(;k<A;k++)w+=roll(dealFrom(deck),d.draw,.8);const p=w/A;if(p<lo-.3||p>hi+.3)continue;

 document.querySelectorAll('.lv').forEach(b=>b.classList.toggle('on',b.dataset.lv==opt('lv')))}
if(!TH.some(t=>t[0]==D.dataset.theme))D.dataset.theme='light';
TH.forEach(([id,name,c1,c2])=>{const b=document.createElement('button');b.className='th';b.dataset.t=id;b.innerHTML=`<i style="--c1:${c1};--c2:${c2}"></i>${name}`;b.onclick=()=>{D.dataset.theme=id;save();applyOpts()};$('#themes').append(b)});
BK.forEach((b,i)=>{const s=document.createElement('button');s.className='sw';s.setAttribute('aria-label',i?'Card back '+i:'Theme card back');if(b)s.style.background=`linear-gradient(145deg,${b[0]},${b[1]})`;s.onclick=()=>{sv.bk=i;save();applyOpts()};$('#backs').append(s)});
[['auto','o-auto'],['fc','o-fc'],['tm','o-tm']].forEach(([k,id])=>{const el=$('#'+id);el.checked=!!opt(k);el.onchange=()=>{sv[k]=el.checked?1:0;save();applyOpts()}});
[['mv','o-mv'],['sp','o-sp'],['sz','o-sz'],['wa','o-wa']].forEach(([k,id])=>{const el=$('#'+id);el.value=opt(k);el.onchange=()=>{sv[k]=k=='wa'?el.value:+el.value;save();applyOpts();layout();place()}});
$('#menu').onclick=()=>{const h=($('#sheet').hidden=!$('#sheet').hidden);$('#menu').setAttribute('aria-expanded',!h)};
addEventListener('pointerdown',e=>{if(!e.target.closest('#sheet,#menu')){$('#sheet').hidden=true;$('#menu').setAttribute('aria-expanded',false)}});
function shuf(r=Math.random){const d=C.map(c=>c.id);for(let i=51;i>0;i--){const j=r()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}return d}
function begin(d,dk,rs){cur={deck:d.slice(),daily:dk||'',lv:opt('lv')};if(!rs){const m=mode();ST.p[m]=(ST.p[m]||0)+1;saveST()}start.classList.add('out');setTimeout(()=>{start.hidden=true;start.classList.remove('out','busy')},500);
 P.stock=d;const dl={};let k=0;for(let r=0;r<7;r++)for(let c=r;c<7;c++){const id=P.stock.pop();P.tab[c].push(id);C[id].up=r==c;dl[id]=k++*45}place(dl);stats();saveGame()}
function reset(k){jid++;lost=false;lostAt=0;$('#lose').hidden=true;$('#giveup').hidden=true;if(!k&&moves>0&&!won){ST.cs=0;saveST()}tok++;wk.forEach(w=>w.terminate());wk=[];cancelChk();clearInterval(timer);timer=0;t0=0;moves=0;hist=[];won=false;busy=false;anim++;msg('');
 $('#win').hidden=true;$('#fin').hidden=true;
 C.forEach(c=>{c.up=false;const s=c.el.style;s.transition='';s.opacity='';s.transformOrigin=''});
 P={stock:C.map(c=>c.id),waste:[],found:[[],[],[],[]],tab:[[],[],[],[],[],[],[]]};layout();
 B.classList.add('noanim');place();B.offsetWidth;B.classList.remove('noanim');stats()}
function newGame(){reset();const my=tok;start.classList.add('busy');
 busy=true;msg(opt('lv')=='impossible'?'Building an impossible deal…':'Finding a '+opt('lv')+' deal…');
 const fail=()=>{busy=false;msg('Solver unavailable, dealt a random game');begin(shuf())};
 try{const nw=Math.min(4,navigator.hardwareConcurrency||2);for(let i=0;i<nw;i++){const w=mkW();wk.push(w);
  w.onmessage=e=>{if(my!=tok)return;wk.forEach(x=>x.terminate());wk=[];busy=false;msg('');begin(e.data.deck||shuf())};
  w.onerror=()=>{if(my==tok){wk.forEach(x=>x.terminate());wk=[];fail()}};w.postMessage({type:'gen',draw,lv:opt('lv')})}}catch(x){fail()}}
function showSetup(){updDaily();$('#sheet').hidden=true;start.classList.remove('out','busy');start.hidden=false;$('#s1').hidden=true;$('#s2').hidden=false;$('#resume').hidden=!(moves>0&&!won&&!busy)}
function showHome(){$('#sheet').hidden=true;$('#win').hidden=true;start.classList.remove('out','busy');start.hidden=false;$('#s1').hidden=false;$('#s2').hidden=true;$('#resume').hidden=!(moves>0&&!won&&!busy)}
$('#play').onclick=()=>{updDaily();$('#s1').hidden=true;$('#s2').hidden=false};
$('#resume').onclick=()=>{start.hidden=true};
$('#home').onclick=showHome;
document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{sv.lv=b.dataset.lv;save();applyOpts();newGame()});
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{draw=+b.dataset.d;$('.seg').dataset.d=draw;save()});
$('.seg').dataset.d=draw;
$('#new').onclick=showSetup;$('#new-top').onclick=showSetup;$('#again').onclick=newGame;
$('#l-undo').onclick=()=>$('#undo').click();$('#l-new').onclick=()=>{unlose();showSetup()};$('#l-rs').onclick=()=>{unlose();$('#rs').click()};
$('#lose').onclick=e=>{if(e.target.id=='lose')$('#lose').hidden=true};
const sstate=()=>({t:P.tab.map(col=>({a:col.slice(),u:col.filter(id=>C[id].up).length})),f:[0,1,2,3].map(s=>{const f=P.found.find(f=>f.length&&C[f[0]].s==s);return f?f.length:0}),k:P.stock.slice(),w:P.waste.slice()});
$('#chk').onclick=()=>{if(won||busy)return;$('#sheet').hidden=true;cancelChk();msg('Checking…');$('#chk').disabled=true;
 try{ck=mkW();ck.onmessage=e=>{if(e.data.prog){msg('Checking… '+Math.round(e.data.prog/1000)+'k positions searched');return}const r=e.data.res;cancelChk();if(r=='lose'){showGiveUp();msg('Not winnable.');}else{hideGiveUp();msg(r=='win'?'Still winnable.':'The search ran out of memory.');}
  setTimeout(()=>{if(!ck&&$('#msg').textContent.match(/winnable|possible|memory/))msg('')},6000)};
  ck.onerror=()=>{cancelChk();hideGiveUp();msg('Solver unavailable')};ck.postMessage({type:'check',s:sstate(),draw})}catch(x){cancelChk();hideGiveUp();msg('Solver unavailable')}};
function autoCollect(){if(won||busy||drag)return;
 const fcnt=s=>{const f=P.found.find(f=>f.length&&C[f[0]].s==s);return f?f.length:0};
 const ok=id=>{const c=C[id];return c.r<=2||(red(c)?[0,3]:[1,2]).every(s=>fcnt(s)>=c.r-1)};
 const tops=[...P.tab.map(t=>t[t.length-1]),P.waste[P.waste.length-1]].filter(id=>id!=null&&C[id].up);
 for(const id of tops)if(ok(id))for(let i=0;i<4;i++)if(move([id],{k:'found',i},1))return}
$('#undo').onclick=()=>{if(!hist.length||busy||won)return;unlose();jid++;cancelChk();const s=JSON.parse(hist.pop());P=s.P;C.forEach((c,i)=>c.up=s.u[i]);moves=s.moves;msg('');place();stats();chkFin();checkGiveUpState();saveGame();};
$('#fin').onclick=()=>{busy=true;$('#fin').hidden=true;$('#giveup').hidden=true;const iv=setInterval(()=>{let m=0;for(let i=0;i<7&&!m;i++){const t=P.tab[i],id=t[t.length-1];if(id!=null)for(let f=0;f<4;f++)if(move([id],{k:'found',i:f})){m=1;break}}if(!m||won){clearInterval(iv);busy=false}},40)};
$('#giveup').onclick=giveUp;
let cur={deck:[],daily:'',lv:'medium'},ST={};
try{ST=JSON.parse(localStorage.getItem('solstats')||'{}')||{}}catch(e){}
['p','w','l','bt','bm','d'].forEach(k=>ST[k]=ST[k]||{});ST.cs=ST.cs||0;ST.bs=ST.bs||0;ST.ds=ST.ds||0;
const saveST=()=>{try{localStorage.setItem('solstats',JSON.stringify(ST))}catch(e){}};
const mode=()=>cur.daily?'daily':cur.lv;
const dkey=()=>new Date().toLocaleDateString('en-CA'),ykey=()=>new Date(Date.now()-864e5).toLocaleDateString('en-CA');
const hsh=k=>[...k].reduce((a,c)=>Math.imul(a^c.charCodeAt(0),16777619),2166136261)>>>0;
const seeded=n=>()=>{n=n+0x6D2B79F5|0;let t=Math.imul(n^n>>>15,1|n);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const fmt=s=>s==null?'-':Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const updDaily=()=>{const v=ST.d[dkey()];$('#daily').textContent='Daily challenge'+(v!=null?' \u2713 '+fmt(v):'')};
function recWin(){const m=mode(),s=Math.floor((Date.now()-t0)/1000);
 ST.w[m]=(ST.w[m]||0)+1;if(!(ST.bt[m]<=s))ST.bt[m]=s;if(!(ST.bm[m]<=moves))ST.bm[m]=moves;
 ST.cs++;ST.bs=Math.max(ST.bs,ST.cs);
 if(cur.daily&&ST.d[cur.daily]==null){ST.d[cur.daily]=s;ST.ds=ST.ld==ykey()?ST.ds+1:1;ST.ld=cur.daily}
 saveST();try{localStorage.removeItem('solgame')}catch(e){}}
function showStats(){$('#sheet').hidden=true;
 const L=[['trivial','Trivial'],['easy','Easy'],['medium','Medium'],['hard','Hard'],['impossible','Impossible'],['daily','Daily']],
 p=Object.values(ST.p).reduce((a,b)=>a+b,0),w=Object.values(ST.w).reduce((a,b)=>a+b,0),l=Object.values(ST.l).reduce((a,b)=>a+b,0),ds=(ST.ld==dkey()||ST.ld==ykey())?ST.ds:0;
 $('#sts>div').innerHTML=`<h3>Stats</h3><div class="g"><div><b>${p}</b><span>Played</span></div><div><b>${w}</b><span>Won</span></div><div><b>${l}</b><span>Lost</span></div><div><b>${p?Math.round(w/p*100):0}%</b><span>Win rate</span></div><div><b>${ST.cs}</b><span>Win streak</span></div><div><b>${ST.bs}</b><span>Best streak</span></div><div><b>${ds}</b><span>Daily streak</span></div></div><table><tr><th>Level<th>Played<th>Won<th>Lost<th>Best<th>Moves</tr>${L.map(([k,n])=>`<tr><td>${n}<td>${ST.p[k]||0}<td>${ST.w[k]||0}<td>${ST.l[k]||0}<td>${fmt(ST.bt[k])}<td>${ST.bm[k]??'-'}</tr>`).join('')}</table><button class="btn p" id="sx">Close</button>`;
 $('#sts').hidden=false;$('#sx').onclick=()=>$('#sts').hidden=true}
$('#st-btn').onclick=showStats;$('#sts').onclick=e=>{if(e.target.id=='sts')$('#sts').hidden=true};
$('#daily').onclick=()=>{const k=dkey();reset();start.classList.add('busy');begin(shuf(seeded(hsh(k))),k)};
$('#rs').onclick=()=>{if(busy||!cur.deck.length)return;$('#sheet').hidden=true;const k=cur.deck.slice(),dk=cur.daily;reset(1);begin(k,dk,1)};
function saveGame(){if(won||!P)return;try{localStorage.setItem('solgame',JSON.stringify({P,u:C.map(c=>c.up),moves,el:t0?Date.now()-t0:0,draw,cur,hist:hist.slice(-40)}))}catch(e){}}
function loadGame(){try{const g=JSON.parse(localStorage.getItem('solgame')||'null');
 if(!g||!g.P||g.P.stock.length+g.P.waste.length+g.P.found.flat().length+g.P.tab.flat().length!=52)return;
 P=g.P;C.forEach((c,i)=>c.up=!!g.u[i]);moves=g.moves;hist=g.hist||[];draw=g.draw;$('.seg').dataset.d=draw;cur=g.cur||cur;
 if(moves>0){t0=Date.now()-g.el;timer=setInterval(stats,500)}
 B.classList.add('noanim');layout();place();B.offsetWidth;B.classList.remove('noanim');stats();chkFin();start.hidden=true;if(!P.stock.length)chkStuck()}catch(e){}}
let hid=0;document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(hid){if(t0)t0+=Date.now()-hid;hid=0}});
function hint(){if(won||busy)return;$('#sheet').hidden=true;cancelChk();msg('Thinking\u2026');
 try{ck=mkW();ck.onmessage=e=>{const r=e.data;cancelChk();if(r.res=='win'&&r.diff)showHint(r.diff);else msg(r.res=='lose'?'No winning line from here. Try Undo.':'No hint found.')};
  ck.onerror=()=>{cancelChk();msg('Solver unavailable')};ck.postMessage({type:'hint',s:sstate(),draw})}catch(x){cancelChk();msg('Solver unavailable')}}
function showHint(d){const hl=[];
 if(d.k=='stock'){msg(P.stock.length?'Draw from the stock':'Recycle the waste');hl.push(slots[0])}
 else{hl.push(C[d.id].el);
  if(d.k=='found')msg('Send this card to the foundation');
  else{msg('Move this card to column '+(d.to+1));const t=P.tab[d.to];if(t.length)hl.push(C[t[t.length-1]].el)}}
 hl.forEach(e=>e.classList.add('hint'));setTimeout(()=>hl.forEach(e=>e.classList.remove('hint')),2800)}
$('#hint').onclick=$('#hint-m').onclick=hint;
addEventListener('resize',()=>{layout();place()});
applyOpts();reset();loadGame();
</script>
</body>
